<style>
:root{--bg:#FAFAF7;--surf:#fff;--ink:#14172B;--mut:#555B73;--pri:#2B3FD6;--onpri:#fff;--acc:#F5B700;--ok:#0E7A52;--bad:#C0392B;--line:#E2E3EA;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#171717;--surf:#202020;--ink:#F2F2F2;--mut:#A8A8B3;--pri:#F5B700;--onpri:#171717;--ok:#4FD1A0;--bad:#FF8A7A;--line:#303030;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 "Atkinson Hyperlegible",system-ui,sans-serif;padding-bottom:80px}
h1,h2,h3{font-family:Geist,"Helvetica Neue",Arial,sans-serif;line-height:1.1;margin:0}
main{max-width:640px;margin:0 auto;padding:20px 16px}
.brand{font:800 18px Geist,"Helvetica Neue",Arial,sans-serif;display:flex;align-items:center;gap:8px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.lnk{font:inherit;font-size:14px;background:none;border:0;color:var(--mut);min-height:44px;padding:0 8px;cursor:pointer;text-decoration:underline}
.brand i{width:14px;height:14px;background:var(--acc);border-radius:50%;display:inline-block}
h1{font-size:clamp(30px,9vw,44px);letter-spacing:-.02em}
.sub{color:var(--mut);margin:10px 0 18px}
.hero{position:relative;overflow:hidden;background:#171717;color:#fff;border-radius:18px;min-height:min(78vh,560px);display:flex;flex-direction:column;justify-content:center;padding:28px 22px;margin-bottom:24px}
.hx{position:absolute;aspect-ratio:1;background:radial-gradient(circle,rgba(245,183,0,.6),rgba(245,183,0,.1) 70%);clip-path:polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)}
.hx:nth-child(1){width:34px!important}.hx:nth-child(2){width:18px!important}.hx:nth-child(3){width:42px!important}
.hero .in{position:relative;max-width:340px;width:100%;margin:0 auto}
.hero small{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#B8BAC6}
.hero h1{font-size:clamp(52px,17vw,92px);line-height:.95;letter-spacing:-.03em;margin:4px 0 6px;text-transform:uppercase;color:#fff;text-shadow:0 0 24px rgba(245,183,0,.25)}
.hero .tl{margin:0;text-align:right;color:var(--acc);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.hero .lk{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
.hero .lk button{font:inherit;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:none;border:0;border-bottom:2px solid #fff;padding:12px 2px;min-height:48px;cursor:pointer}
label{font-weight:700;font-size:15px}
input,textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--surf);border:2px solid var(--line);border-radius:10px;padding:12px;margin:6px 0 12px}
textarea{min-height:140px}
:is(input,textarea,select,button,a):focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{font:inherit;font-weight:700;background:var(--pri);color:var(--onpri);border:2px solid var(--pri);border-radius:10px;padding:10px 18px;min-height:48px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.alt{background:transparent;color:var(--pri)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.chip{flex:none;font:inherit;border:2px solid var(--line);background:var(--surf);color:var(--ink);border-radius:99px;padding:8px 14px;min-height:44px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.card h3{font-size:20px;margin-bottom:4px}
.card p{margin:4px 0}
.tag{display:inline-block;font-size:13px;font-weight:700;background:var(--acc);color:#14172B;border-radius:6px;padding:2px 8px;margin-bottom:8px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
pre{white-space:pre-wrap;word-break:break-word;font:inherit;margin:6px 0}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad)}
.note{font-size:14px;color:var(--mut);margin-top:20px}
.hero .hi{margin:0 0 4px;font:800 22px Geist,"Helvetica Neue",Arial,sans-serif;color:#fff}
.hero h1 .ln{display:block}.hero h1 .ch{display:inline-block}
.hero h1 .hub{display:inline-block;margin-top:8px;background:#F5B700;color:#171717;padding:0 .16em;border-radius:.14em;transform:rotate(-3deg);box-shadow:0 0 40px rgba(245,183,0,.5);text-shadow:none}
@keyframes glowT{from{text-shadow:0 0 24px rgba(245,183,0,.25)}to{text-shadow:0 0 44px rgba(245,183,0,.6)}}
@keyframes glowB{from{box-shadow:0 0 30px rgba(245,183,0,.4)}to{box-shadow:0 0 64px rgba(245,183,0,.8)}}
.hero h1 .ln{animation:glowT 2.4s ease-in-out infinite alternate}.hero h1 .hub{animation:glowB 1.8s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){.hero h1 .ln,.hero h1 .hub{animation:none}}
.tick{overflow:hidden;white-space:nowrap;margin:-8px 0 18px;color:var(--mut);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.trk{display:inline-block;will-change:transform}.trk span{margin-right:28px}
.stats{display:flex;gap:10px;margin-bottom:22px}.stats div{flex:1;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px}.stats b{display:block;font:800 30px Geist,sans-serif}.stats span{font-size:13px;color:var(--mut)}
.btn,.chip,.lnk{transition:transform .15s ease,opacity .15s}.btn:active,.chip:active{transform:scale(.95)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surf);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;font:inherit;font-size:13px;font-weight:700;color:var(--mut);background:none;border:0;border-top:4px solid transparent;padding:14px 2px;min-height:56px;cursor:pointer}
nav button[aria-current=page]{color:var(--pri);border-top-color:var(--acc)}

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const NAV=[[0,"Explore"],[6,"Earn"],[1,"Market"],[4,"Study"],[5,"IQ"]];
const OPP=[
["Chevening Scholarships","Scholarship","UK government scholarships for a one-year master’s degree. Open to applicants from many countries.","https://www.chevening.org"],
["Fulbright Program","Scholarship","US government exchange awards for study, research and teaching. Rules differ by country.","https://fulbrightprogram.org"],
["Mastercard Foundation Scholars","Scholarship","Scholarships and support for talented students, with a focus on Africa.","https://mastercardfdn.org/all/scholars/"],
["GitHub Student Developer Pack","Free tools","Free developer tools and credits when you verify as a student.","https://education.github.com/pack"],
["Canva for Education","Free tools","Free design tools for students and teachers. Make flyers and posters at no cost.","https://www.canva.com/education/"],
["Notion for Education","Free tools","Free upgraded plan for students. Organise notes, tasks and projects.","https://www.notion.so/product/notion-for-education"],
["freeCodeCamp","Learning","Free coding lessons and certificates. Works well on a phone.","https://www.freecodecamp.org"],
["CS50 (Harvard)","Learning","Free introductory computer science course with video lectures.","https://cs50.harvard.edu/x"],
["Microsoft Learn","Learning","Free self-paced training for cloud, data and AI skills.","https://learn.microsoft.com/training"],
["Coursera financial aid","Learning","Many courses offer financial aid. Look for the aid link on a course page.","https://www.coursera.org"],
["MLH hackathons","Compete","Student hackathons, many online and free to join. Build a team and a portfolio.","https://mlh.io"],
["Google Summer of Code","Compete","Paid open-source projects with mentors. Check current eligibility.","https://summerofcode.withgoogle.com"],
["Kaggle","Compete","Free datasets, contests and notebooks to practise data science.","https://www.kaggle.com"]];
let tab=0,flt="All",q="",pre="";
const saved=new Set(ld("saved",[]));let listings=ld("listings",[]);
let user=ld("user","");document.documentElement.dataset.theme=ld("theme","dark");

function view(){
 $("#who").innerHTML=user?`<button class="lnk" data-a="theme">Light or dark</button><button class="lnk" data-a="out">Sign out</button>`:`<span style="font-size:12px;color:var(--mut)">v6 · cloud ${typeof sb!=="undefined"&&sb&&sb.from?"on":"off"}</span>`;
 if(!user){$("#nav").innerHTML="";gate();motion();return}
 $("#nav").innerHTML=NAV.map(([i,t])=>`<button data-t="${i}" ${(i===tab||(i===6&&(tab===2||tab===3)))?'aria-current="page"':""}>${t}</button>`).join("");
 [v0,v1,v2,v3,v4,v5,v6][tab]();scrollTo(0,0);motion()}

function v0(){
 $("#app").innerHTML=`<section class="hero"><span class="hx" aria-hidden="true" style="left:62%;top:6%;width:96px"></span><span class="hx" aria-hidden="true" style="left:8%;top:20%;width:48px"></span><span class="hx" aria-hidden="true" style="left:16%;top:76%;width:110px"></span><div class="in"><p class="hi">Hello, ${esc(user)}</p><small>Welcome to</small><h1 aria-label="Campus Hub"><span class="ln" aria-hidden="true">${[..."Campus"].map(c=>`<span class="ch">${c}</span>`).join("")}</span><span class="hub" aria-hidden="true">Hub</span></h1><p class="tl">learn, earn, sell for free</p><div class="lk"><button data-a="focusq">Find opportunities</button><button data-t="1">Start selling</button></div></div></section><div class="tick" aria-hidden="true"><div class="trk">${[...OPP,...OPP].map(o=>`<span>${o[0]}</span>`).join("")}</div></div><div class="stats"><div><b data-count="${OPP.length}">${OPP.length}</b><span>free opportunities</span></div><div><b data-count="8">8</b><span>study tools</span></div><div><b>$0</b><span>to start</span></div></div><h2 style="font-size:24px">Opportunities that cost nothing to try</h2><p class="sub">Save the ones you want, then check each site for current deadlines.</p><label for="q">Search</label><input id="q" type="search" placeholder="Try: scholarship"><div class="chips" id="chips"></div><div id="list"></div><p class="note">Saved items stay on this device. Always confirm details on the official site.</p>${(window.CAMPUS_CONFIG||{}).CONTACT_EMAIL?`<article class="card"><span class="tag">For sponsors</span><h3>Reach students directly</h3><p>Universities, NGOs, scholarship programs and student-focused brands can feature an opportunity here, with a clear Sponsored label and a click report.</p><div class="row"><a class="btn alt" href="mailto:${esc((window.CAMPUS_CONFIG||{}).CONTACT_EMAIL)}?subject=${encodeURIComponent("Sponsor CampusHub")}">Partner with us</a></div></article>`:""}`;
 $("#q").value=q;$("#q").oninput=e=>{q=e.target.value;list()};list()}
function list(){
 const F=["All","Saved","Scholarship","Free tools","Learning","Compete"];
 $("#chips").innerHTML=F.map(f=>`<button class="chip" data-f="${f}" aria-pressed="${f===flt}">${f}</button>`).join("");
 const r=OPP.filter(o=>(flt==="All"||(flt==="Saved"?saved.has(o[0]):o[1]===flt))&&(o[0]+o[1]+o[2]).toLowerCase().includes(q.toLowerCase()));
 $("#list").innerHTML=r.length?r.map(o=>`<article class="card">${o[4]?`<span class="tag">Sponsored${o[5]?" · "+esc(o[5]):""}</span> `:""}<span class="tag">${esc(o[1])}</span><h3>${esc(o[0])}</h3><p>${esc(o[2])}</p><div class="row"><a class="btn" href="${esc(o[3])}" data-oid="${o[6]?esc(o[6]):""}" target="_blank" rel="noopener">Open site</a><button class="btn alt" data-s="${esc(o[0])}">${saved.has(o[0])?"Saved":"Save"}</button></div></article>`).join(""):`<p class="sub">Nothing matches. Clear the search or pick another filter.</p>`;r.forEach(o=>{if(o[4]&&o[6])track(o[6],"view")});reveal()}

function v1Local(){
 const ex=[{t:"Example: Exam revision notes pack",p:"$3",x:1},{t:"Example: Typing and data entry, per page",p:"$1",x:1}];
 const all=[...listings,...ex];
 $("#app").innerHTML=`<h1>Sell with no shop and no stock.</h1><p class="sub">List notes, designs, tutoring or typing. Buyers message you on WhatsApp, so there are no fees. Share your listing on your status and in class groups.</p>
 <div class="card"><label for="lt">What are you selling?</label><input id="lt" value="${esc(pre)}" placeholder="Biology study pack">
 <label for="lp">Price</label><input id="lp" placeholder="$2 or 500 naira">
 <label for="ln">Your WhatsApp number with country code, digits only</label><input id="ln" inputmode="numeric" placeholder="2348012345678">
 <label for="mf">Photo or video (optional)</label><input id="mf" type="file" accept="image/*,video/*"><div id="mp"></div><p id="lm" class="bad" role="alert"></p><button class="btn" data-a="add">Add listing</button></div>
 ${all.map((l,i)=>`<article class="card"><span class="tag">${l.x?"Example":l.mine===false?"Seller":"Your listing"}</span><h3>${esc(l.t)}</h3>${su(l.img)?`<img src="${su(l.img)}" alt="${esc(l.t)}" style="width:100%;border-radius:10px;margin:8px 0">`:""}${su(l.vid)?`<video src="${su(l.vid)}" controls playsinline style="width:100%;border-radius:10px;margin:8px 0"></video>`:""}<p>${esc(l.p)}</p>${l.x?"":`<div class="row">${l.mine===false?`<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${l.n}?text=${encodeURIComponent("Hi, I am interested in: "+l.t)}">Message seller</a>`:`<a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(l.t+" - "+l.p+". Order on WhatsApp: https://wa.me/"+l.n)}">Share on WhatsApp</a><button class="btn alt" data-a="del" data-i="${i}">Remove</button>`}</div>`}</article>`).join("")}
 <p class="note">Listings are saved on this device. A shared marketplace where other students see them needs the backend in the build plan.</p>`;pre="";mediaUp()}
function addLocal(){
 const t=$("#lt").value.trim(),p=$("#lp").value.trim(),n=$("#ln").value.replace(/\D/g,"");
 if(!t||!p||n.length<7||n.length>15){$("#lm").textContent="Add a title, a price, and a WhatsApp number with country code.";return}
 listings.unshift({t,p,n,img:M.img,vid:M.vid});M={};sv2();v1()}
function delLocal(b){listings.splice(+b.dataset.i,1);sv2();v1()}

function v2(){
 $("#app").innerHTML=`<h1>Clean data. Get paid for accuracy.</h1><p class="sub">Paste rows in this order: name, phone, email. This tool finds blanks, bad emails, bad phones and duplicates, so you hand over clean work.</p>
 <label for="d">Rows</label><textarea id="d" placeholder="ada obi, 08012345678, ada@mail.com&#10;ada obi, 08012345678, ada@mail.com&#10;Tunde, 123, tunde@mail"></textarea>
 <button class="btn" data-a="chk">Check and clean</button><div id="o" style="margin-top:16px"></div>`}
function chk(){
 const L=$("#d").value.split("\n").map(l=>l.trim()).filter(Boolean),seen=new Set(),good=[],bad=[];
 L.forEach((l,i)=>{
  const p=l.split(/[,;\t]/).map(x=>x.trim()),pr=[];
  if(p.length<3||p.some(x=>!x))pr.push("missing field");
  const ph=(p[1]||"").replace(/[^\d+]/g,""),dg=ph.replace(/\D/g,"");
  if(p[1]&&(dg.length<7||dg.length>15))pr.push("check phone");
  if(p[2]&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(p[2]))pr.push("bad email");
  const k=[(p[0]||"").toLowerCase(),dg,(p[2]||"").toLowerCase()].join("|");
  if(seen.has(k))pr.push("duplicate");
  seen.add(k);
  pr.length?bad.push(`Row ${i+1}: ${pr.join(", ")}`):good.push([p[0].replace(/(^|\s)\S/g,c=>c.toUpperCase()),ph,p[2].toLowerCase()].join(","))});
 $("#o").innerHTML=L.length?`<p><span class="ok">${good.length} clean</span> of ${L.length} rows. ${bad.length?`<span class="bad">${bad.length} need fixing.</span>`:""}</p>${bad.length?`<div class="card">${bad.map(esc).join("<br>")}</div>`:""}${good.length?`<div class="card"><pre id="csv">${esc(good.join("\n"))}</pre><div class="row"><button class="btn alt" data-c="csv">Copy clean rows</button><span id="dlb"></span></div></div>`:""}`:`<p class="bad">Paste some rows first.</p>`;dlup()}

function v3(){
 $("#app").innerHTML=`<h1>Turn what you sell into posts.</h1><p class="sub">Fill three boxes. Get ready-to-send text for WhatsApp, Instagram or TikTok, and a flyer headline.</p>
 <label for="a">What you sell</label><input id="a" placeholder="Hand-written physics notes">
 <label for="b">Price</label><input id="b" placeholder="$2">
 <label for="c">Contact</label><input id="c" placeholder="WhatsApp +234 801 234 5678">
 <label for="e">Tone</label><select id="e"><option>Friendly</option><option>Professional</option><option>Excited</option></select>
 <button class="btn" data-a="gen">Write my posts</button><div id="o" style="margin-top:16px"></div>`}
function gen(){
 const a=$("#a").value.trim(),b=$("#b").value.trim(),c=$("#c").value.trim(),t=$("#e").value;
 if(!a||!b||!c){$("#o").innerHTML=`<p class="bad" role="alert">Fill in what you sell, the price and your contact.</p>`;return}
 const H={Friendly:["Hey friends!","Message me to order."],Professional:["Now available:","To place an order, contact me."],Excited:["Big news!","Order now before it sells out."]}[t];
 const P=[["WhatsApp status",`${H[0]} ${a} for ${b}.\n${H[1]}\n${c}`],
 ["Instagram or TikTok caption",`${a}. Made by a student, for students.\nPrice: ${b}\nOrder: ${c}\n#StudentHustle #CampusLife #SupportStudentBusiness`],
 ["Flyer headline",`${a.toUpperCase()}\n${b}\nOrder: ${c}`]];
 $("#o").innerHTML=P.map((p,i)=>`<article class="card"><span class="tag">${p[0]}</span><pre id="p${i}">${esc(p[1])}</pre><div class="row"><button class="btn alt" data-c="p${i}">Copy</button>${i===0?`<a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(p[1])}">Send on WhatsApp</a>`:""}</div></article>`).join("")}

function gateLocal(){
 $("#app").innerHTML=`<section class="hero"><span class="hx" aria-hidden="true" style="left:64%;top:8%;width:90px"></span><span class="hx" aria-hidden="true" style="left:10%;top:72%;width:100px"></span><div class="in"><small>Sign in</small><h1>Hello</h1><p class="tl">what should we call you?</p><label for="un" style="display:block;margin-top:22px;color:#fff">Username</label><input id="un" maxlength="20" autocomplete="nickname" placeholder="Ada"><p id="um" class="bad" role="alert"></p><button class="btn" data-a="login">Continue</button></div></section><p class="note" role="status"><b>Cloud sign-in is OFF.</b> ${esc(cloudWhy())} Sign-up, email verification and password reset only work when it is on. This screen is offline mode.</p>`;
 $("#un").onkeydown=e=>{if(e.key==="Enter")login()}}
function login(){const n=$("#un").value.trim().replace(/\s+/g," ");if(n.length<2){$("#um").textContent="Enter at least 2 characters.";return}user=n;sv("user",n);tab=0;view()}
function out(){if(sb){sb.auth.signOut().then(()=>{me=null;user="";saved.clear();view()})}else{user="";sv("user","");view()}}
function theme(){const t=document.documentElement.dataset.theme==="light"?"dark":"light";document.documentElement.dataset.theme=t;sv("theme",t)}
function dlup(){window.claude&&claude.use("downloads").then(d=>{if(d&&$("#csv")&&$("#dlb"))$("#dlb").innerHTML=`<button class="btn" data-a="dl">Download CSV</button>`}).catch(()=>{})}
async function dl(){try{const d=await claude.use("downloads");await d.save({filename:"clean-data.csv",data:"name,phone,email\n"+$("#csv").textContent})}catch(e){}}
const Z={sub:"notes",text:ld("notes",""),len:3,deck:[],flip:false,done:false,qs:[],qi:0,sc:0,ans:null,src:"notes",rec:null,ai:"ask"};
const SUBS=[["notes","Notes"],["sum","Summary"],["cards","Cards"],["quiz","Quiz"],["map","Map"],["listen","Listen"],["export","Export"],["ai","Ask AI"]];
const SW=new Set("about after again also because before being between could does during each every from have having into more most other over same should some such than that their them then there these they this those through under very were what when where which while with would your".split(" "));
let tmr=null,tleft=1500;
const fm=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
function an(){const t=Z.text.trim();if(an.k===t)return an.v;
 const sen=t.split(/(?<=[.!?])\s+|\n+/).map(s=>s.trim()).filter(s=>s.length>25),f={};
 (t.toLowerCase().match(/\p{L}{5,}/gu)||[]).forEach(w=>{if(!SW.has(w))f[w]=(f[w]||0)+1});
